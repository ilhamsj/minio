name: Build image to GHCR

# Builds this fork from source and pushes ghcr.io/<owner>/<repo>:latest and
# :<commit-date>-<sha>, for linux/amd64 and linux/arm64.
# Runs on every push to master (including "Sync fork") or manually.
on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve image name, tags and ldflags
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=$(git log -1 --format=%cd --date=format:%Y%m%d)-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "ldflags=$(go run buildscripts/gen-ldflags.go)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ghcr
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LDFLAGS=${{ steps.meta.outputs.ldflags }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
